# git-docker-release — see https://github.com/jkloian/git-docker-release
#
# Assets are baked into the Docker image (Vite output under public/vite). Do not set
# SKIP_VITE_BUILD=true or strip public/vite before build unless you serve assets from S3/CDN.
branches:
  rc: staging
  production: master
assets:
  command: bin/build-and-upload-assets
  env:
    ASSET_VERSION: "{{tag}}"
